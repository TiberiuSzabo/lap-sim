name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A real MongoDB next to the job, so the repository contract tests run against it
    # instead of being skipped.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci installs exactly what package-lock.json says, and fails if it is out of date.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    # Only worth building the images if the code in them passes its tests.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      # Builds every image in docker-compose.yml (backend and frontend).
      - run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    # Pull requests only get the checks; a push to main also goes live.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # Two pushes in a row must not deploy at the same time.
    concurrency: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Secrets pasted on Windows can carry "\r" line endings, which ssh cannot read.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fails here with a clear message if the key was pasted incompletely.
          ssh-keygen -l -f ~/.ssh/deploy_key
          # The server's fingerprint is pinned, so the job cannot be tricked into
          # talking to a different machine.
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # No command here: the server only lets this key run the deploy (forced command).
          # BatchMode: fail instead of waiting for a password prompt nobody can answer.
          ssh -o BatchMode=yes -i ~/.ssh/deploy_key "azureuser@$HOST"

      - name: Check the site answers
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 5
          curl --fail --silent --show-error --max-time 10 "http://$HOST/api/cars" > /dev/null
          echo "http://$HOST is up"
