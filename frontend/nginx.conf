server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The site and the API share one address, so the browser needs no CORS.
    # "backend" is the service name from docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite puts a content hash in these file names, so a file never changes under the same
    # name and browsers may keep it for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
